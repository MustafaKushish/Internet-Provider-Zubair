<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>لا يوجد اتصال</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020617; color: #e2e8f0;
         font-family: "Segoe UI", Tahoma, sans-serif; }
  .card { max-width: 420px; padding: 32px; border: 1px solid #1e293b; border-radius: 20px; background: #0f172a; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: #94a3b8; line-height: 1.7; margin: 0 0 20px; }
  button { background: #0891b2; color: #fff; border: 0; border-radius: 10px; padding: 10px 22px; font-size: 14px; font-weight: 700; cursor: pointer; }
  button:hover { background: #06b6d4; }
</style>
</head>
<body>
  <div class="card">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تعذر فتح المنظومة. تحقق من الإنترنت ثم أعد المحاولة. بعد أول تشغيل ناجح تفتح المنظومة حتى مع انقطاع الإنترنت.</p>
    <button id="retry" type="button">إعادة المحاولة</button>
  </div>
<script>
  const target = new URLSearchParams(location.search).get('url');
  document.getElementById('retry').addEventListener('click', () => { if (target) location.href = target; });
</script>
</body>
</html>
